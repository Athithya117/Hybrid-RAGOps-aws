# infra/helm/grafana-values.yaml
replicaCount: 1

# Persistence for sqlite (better: use a PVC so dashboards/plugins survive restarts)
persistence:
  enabled: true
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  # storageClassName: fast-ssd    # set if you have a cluster storage class

# Service
service:
  type: ClusterIP
  port: 3000

# Admin credentials - use a Kubernetes Secret in production instead of in-values
admin:
  existingSecret: grafana-admin-secret   # create this secret with username/password

# Dashboard provisioning: map ConfigMap(s) -> dashboard provider(s)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "platform-dashboards"
        orgId: 1
        folder: "Platform"
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards

# Map provider -> ConfigMap(s). Keys are provider identifiers
dashboardsConfigMaps:
  platform-dashboards: grafana-dashboards

# Ensure the pod scans dashboardsConfigMaps ConfigMaps in the same namespace
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard  # or set searchNamespace, etc.
    searchNamespace: ""
    # you can use searchNamespace: "" (defaults to local namespace)

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
