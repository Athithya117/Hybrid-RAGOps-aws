apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: inference
  labels: &id001
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: frontend-sa
      containers:
      - name: frontend
        image: athithya5354/frontend-and-auth:v5
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: frontend-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: JWT_SECRET
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: SESSION_SECRET
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: GOOGLE_CLIENT_SECRET
        - name: MS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: MS_CLIENT_SECRET
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: GITHUB_CLIENT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /orchestrator/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /orchestrator/health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 1
