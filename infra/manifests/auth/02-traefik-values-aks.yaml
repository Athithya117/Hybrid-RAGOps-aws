replicas: 1
service:
  spec:
    type: LoadBalancer
additionalArguments:
- --providers.kubernetescrd
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
ports:
  web:
    port: 80
  websecure:
    port: 443
ingressClass:
  enabled: true
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
