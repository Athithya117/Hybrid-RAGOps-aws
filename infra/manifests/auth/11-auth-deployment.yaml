apiVersion: apps/v1
kind: Deployment
metadata:
  name: forward-auth
  namespace: inference-auth
  labels: &id001
    app: forward-auth
spec:
  replicas: 2
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: forward-auth
        image: athithya5354/forward-auth:v3
        ports:
        - containerPort: 9000
        command:
        - uvicorn
        args:
        - stateless_openid_auth:app
        - --host
        - 0.0.0.0
        - --port
        - '9000'
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        envFrom:
        - configMapRef:
            name: forward-auth-config
        - secretRef:
            name: forward-auth-secret
