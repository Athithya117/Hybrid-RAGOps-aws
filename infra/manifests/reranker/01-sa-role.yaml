apiVersion: v1
kind: ServiceAccount
metadata:
  name: reranker-sa
  namespace: models

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reranker-role
  namespace: models
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reranker-rb
  namespace: models
subjects:
- kind: ServiceAccount
  name: reranker-sa
  namespace: models
roleRef:
  kind: Role
  name: reranker-role
  apiGroup: rbac.authorization.k8s.io
