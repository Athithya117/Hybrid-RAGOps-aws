apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    managed-by: dashboards.py
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      managed-by: dashboards.py
  template:
    metadata:
      labels:
        app: grafana
        managed-by: dashboards.py
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.3.5
        env:
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_HOST
          value: grafana-postgres.monitoring.svc.cluster.local:5432
        - name: GF_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: grafana-postgres-secret
              key: postgres-db
        - name: GF_DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: grafana-postgres-secret
              key: postgres-user
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-postgres-secret
              key: postgres-password
        - name: GF_SECURITY_ADMIN_USER
          value: user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin-secret
              key: admin-password
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: provisioning
          mountPath: /etc/grafana/provisioning/dashboards
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: provisioning
        configMap:
          name: grafana-provisioning
      - name: datasources
        configMap:
          name: grafana-datasources
