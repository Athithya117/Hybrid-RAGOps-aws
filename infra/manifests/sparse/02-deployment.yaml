apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparse-deployment
  namespace: models
  labels: &id001
    app.kubernetes.io/name: sparse
    app.kubernetes.io/component: embedder
    app.kubernetes.io/managed-by: gen_sparse
    app.kubernetes.io/instance: sparse
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels: *id001
      annotations:
        gen-sparse/inputs-hash: f0be9f7a2c198aec8f22ae199709adf6ed905c7eff6718197c981125f6fb5ae6
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8201'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sparse-sa
      containers:
      - name: sparse
        image: athithya5354/sparse:v1
        ports:
        - containerPort: 8201
        env:
        - name: SPARSE_PORT
          value: '8201'
        - name: ENV
          value: STAGING
        - name: SPARSE_LOGLEVEL
          value: INFO
        livenessProbe:
          httpGet:
            path: /health
            port: 8201
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8201
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8201
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
