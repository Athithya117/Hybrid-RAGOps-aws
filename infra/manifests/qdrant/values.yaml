replicaCount: 1
image:
  repository: qdrant/qdrant
  tag: v1.16.0
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
p2p:
  port: 6335
cluster:
  enabled: true
  peers:
  - http://qdrant-0.qdrant-headless:6335
snapshots:
  enabled: false
  s3:
    bucket: ''
    endpoint: https://s3.ap-south-1.amazonaws.com
    region: ap-south-1
    prefix: qdrant/backups
extraEnv:
- name: AWS_ACCESS_KEY_ID
  valueFrom:
    secretKeyRef:
      name: qdrant-backup-aws
      key: AWS_ACCESS_KEY_ID
- name: AWS_SECRET_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: qdrant-backup-aws
      key: AWS_SECRET_ACCESS_KEY
- name: AWS_SESSION_TOKEN
  valueFrom:
    secretKeyRef:
      name: qdrant-backup-aws
      key: AWS_SESSION_TOKEN
- name: QDRANT__SERVICE__API_KEY
  valueFrom:
    secretKeyRef:
      name: qdrant-service-creds
      key: QDRANT__SERVICE__API_KEY
resources:
  requests:
    cpu: '1'
    memory: 2Gi
  limits:
    cpu: '1'
    memory: 2Gi
tolerations: []
persistence:
  enabled: true
  storageClass: standard
  size: 50Gi
config:
  params:
    shard_number: 1
    replication_factor: 1
    write_consistency_factor: 1
  log_level: INFO
  storage:
    storage_path: /qdrant/storage
    snapshots_path: /qdrant/snapshots
