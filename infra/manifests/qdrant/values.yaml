replicaCount: 1
image:
  repository: qdrant/qdrant
  tag: v1.16.0
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
p2p:
  port: 6335
cluster:
  enabled: true
  peers:
  - http://qdrant-0.qdrant-headless:6335
snapshots:
  enabled: false
  s3:
    bucket: ''
    endpoint: https://s3.ap-south-1.amazonaws.com
    region: ap-south-1
    prefix: qdrant/backups
extraEnv:
- name: QDRANT__SERVICE__API_KEY
  value: ''
- name: QDRANT__STORAGE__SNAPSHOTS_CONFIG__SNAPSHOTS_STORAGE
  value: ''
- name: QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__BUCKET
  value: ''
- name: QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__REGION
  value: ap-south-1
- name: QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__ENDPOINT_URL
  value: https://s3.ap-south-1.amazonaws.com
resources:
  requests:
    cpu: '1'
    memory: 2Gi
  limits:
    cpu: '1'
    memory: 2Gi
tolerations: []
persistence:
  enabled: true
  storageClass: standard
  size: 50Gi
config:
  params:
    shard_number: 1
    replication_factor: 1
    write_consistency_factor: 1
  log_level: INFO
  storage:
    storage_path: /qdrant/storage
    snapshots_path: /qdrant/snapshots
