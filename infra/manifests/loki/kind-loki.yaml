apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-logs-shipper-role
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-logs-shipper-binding
subjects:
- kind: ServiceAccount
  name: vector-logs-shipper
  namespace: observability
roleRef:
  kind: ClusterRole
  name: vector-logs-shipper-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  config.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n\
    \  path_prefix: /data/loki\n  replication_factor: 1\nschema_config:\n  configs:\n\
    \  - from: '2018-04-15'\n    store: boltdb-shipper\n    object_store: filesystem\n\
    \    schema: v11\n    index:\n      prefix: index_\n      period: 24h\nstorage_config:\n\
    \  filesystem:\n    directory: /data/loki/chunks\nlimits_config: {}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      serviceAccountName: loki
      containers:
      - name: loki
        image: grafana/loki:3.6.3
        args:
        - -config.file=/etc/loki/config/config.yaml
        - -target=all
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc/loki/config
        - name: data
          mountPath: /data/loki
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-loki
  namespace: observability
spec:
  selector:
    app: loki
  ports:
  - port: 3100
    targetPort: 3100
    name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
  labels:
    managed-by: observability_logging
data:
  vector.yaml: "sources:\n  kubernetes_logs:\n    type: kubernetes_logs\nsinks:\n\
    \  loki:\n    type: http\n    inputs:\n    - kubernetes_logs\n    uri: http://loki-loki.observability.svc.cluster.local:3100/loki/api/v1/push\n\
    \    encoding:\n      codec: json\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-logs-shipper
  namespace: observability
  labels:
    managed-by: observability_logging
    app: vector-logs-shipper
spec:
  selector:
    matchLabels:
      app: vector-logs-shipper
  template:
    metadata:
      labels:
        app: vector-logs-shipper
    spec:
      serviceAccountName: vector-logs-shipper
      containers:
      - name: vector
        image: timberio/vector:0.51.1-distroless-libc
        args:
        - -c
        - /etc/vector/vector.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/vector
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: vector-config
