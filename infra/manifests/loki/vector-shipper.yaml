apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-logs-shipper-role
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-logs-shipper-binding
subjects:
- kind: ServiceAccount
  name: vector-logs-shipper
  namespace: observability
roleRef:
  kind: ClusterRole
  name: vector-logs-shipper-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
  labels:
    managed-by: observability_logging
data:
  vector.yaml: "sources:\n  kubernetes_logs:\n    type: kubernetes_logs\nsinks:\n\
    \  loki:\n    type: http\n    inputs:\n    - kubernetes_logs\n    uri: http://loki-loki.observability.svc.cluster.local:3100/loki/api/v1/push\n\
    \    encoding:\n      codec: json\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-logs-shipper
  namespace: observability
  labels:
    managed-by: observability_logging
    app: vector-logs-shipper
spec:
  selector:
    matchLabels:
      app: vector-logs-shipper
  template:
    metadata:
      labels:
        app: vector-logs-shipper
    spec:
      serviceAccountName: vector-logs-shipper
      containers:
      - name: vector
        image: timberio/vector:0.51.1-distroless-libc
        args:
        - -c
        - /etc/vector/vector.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/vector
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: vector-config
