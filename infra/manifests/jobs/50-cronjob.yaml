apiVersion: batch/v1
kind: CronJob
metadata:
  name: indexing-backup-cronjob
  namespace: indexing
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      parallelism: 3
      completions: 1
      template:
        metadata:
          labels:
            app: indexing-backup-cronjob
          annotations:
            indexing/config-checksum: c48bb335804f56185bc3cae26a38bbfd07b2eaf41f3c2a9ec13f966455bf3d0b
        spec:
          serviceAccountName: indexer-cron-sa
          restartPolicy: Never
          containers:
          - name: indexer
            image: athithya5354/indexing_pipeline_cpu:v17
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            args:
            - 'set -e

              DESIRED="${DESIRED_NOFILE:-262144}"

              ulimit -n "$DESIRED" 2>/dev/null || true

              echo "nofile limit: $(ulimit -n 2>/dev/null || echo unknown)"

              exec /opt/venv/bin/python indexing_pipeline.py'
            env:
            - name: AVOID_BACKUP_AFTER_EMPTY_INDEXING
              value: 'true'
            - name: AZURE_CHUNKED_PREFIX
              value: data/chunked/
            - name: AZURE_CLIENT_ID
              value: ''
            - name: AZURE_CONTAINER
              value: rag-data-515
            - name: AZURE_ENDPOINT_SUFFIX
              value: core.windows.net
            - name: AZURE_LOCATION
              value: eastus
            - name: AZURE_RESOURCE_GROUP_NAME
              value: rg-e2e-rag
            - name: AZURE_SAS_TOKEN
              value: ''
            - name: AZURE_SECRET_NAME
              value: indexer-azure-creds
            - name: AZURE_STORAGE_ACCOUNT_KEY
              value: ''
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: defaultsa515
            - name: AZURE_STORAGE_API_VERSION
              value: ''
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: indexer-azure-creds
                  key: AZURE_STORAGE_CONNECTION_STRING
            - name: AZURE_SUBSCRIPTION_ID
              value: b1e221f4-74ef-4e62-9bca-fb70aef41930
            - name: AZURE_TENANT_ID
              value: b8a65a11-9d1c-4d48-b9f6-dabfc67f2e4b
            - name: BACKUP_AZ_CONTAINER
              value: backups-515
            - name: BACKUP_ENV
              value: STAGING
            - name: BACKUP_INVOKE_RETRIES
              value: '3'
            - name: BACKUP_INVOKE_RETRY_BASE
              value: '2.0'
            - name: BACKUP_LOCAL_DIR
              value: tmp
            - name: BACKUP_PREFIX
              value: qdrant/backup
            - name: BACKUP_RETRY_ATTEMPTS
              value: '4'
            - name: BACKUP_RETRY_BASE
              value: '1.5'
            - name: BACKUP_TIMEOUT
              value: '300'
            - name: BATCH_SIZE
              value: '8'
            - name: CSV_TARGET_TOKENS_PER_CHUNK
              value: '400'
            - name: DENSE_DIM
              value: '384'
            - name: DENSE_URL
              value: http://dense-svc.models.svc.cluster.local:8200
            - name: ENABLE_QDRANT_BACKUP
              value: 'true'
            - name: ENV
              value: ''
            - name: EXTRA_SECRET_NAME
              value: indexer-extra-secrets
            - name: FORCE_QDRANT_BACKUP
              value: 'false'
            - name: HTTP_TIMEOUT
              value: '60'
            - name: INDEXING_PIPELINE_CPU_IMAGE_REPO
              value: athithya5354/indexing_pipeline_cpu
            - name: INDEXING_PIPELINE_CPU_IMAGE_TAG
              value: v17
            - name: INDEX_STDOUT_TAIL_LINES
              value: '2000'
            - name: INDEX_TIMEOUT
              value: '1800'
            - name: JSONL_TARGET_TOKENS_PER_CHUNK
              value: '400'
            - name: LOG_LEVEL
              value: INFO
            - name: MANIFESTS_DIR
              value: infra/manifests/jobs
            - name: MAX_TOKENS_PER_CHUNK
              value: '320'
            - name: MIN_INDEXED_POINTS_FOR_BACKUP
              value: '100'
            - name: MIN_INDEX_DELTA_RATIO_FOR_BACKUP
              value: '0.0'
            - name: MIN_TOKENS_PER_CHUNK
              value: '100'
            - name: NAMESPACE
              value: indexing
            - name: OVERWRITE_ALL_AUDIO_FILES
              value: 'true'
            - name: OVERWRITE_DOC_DOCX_TO_PDF
              value: 'true'
            - name: OVERWRITE_PPT_WITH_PPTS
              value: 'true'
            - name: OVERWRITE_SPREADSHEETS_WITH_CSV
              value: 'true'
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: QDRANT_API_KEY
            - name: QDRANT_SECRET_NAME
              value: qdrant-api-key
            - name: QDRANT_URL
              value: http://qdrant.qdrant.svc.cluster.local:6333
            - name: ROLEBINDING_NAME
              value: indexer-cron-rb
            - name: ROLE_NAME
              value: indexer-cron-role
            - name: RUN_QDRANT_BACKUP_PATH
              value: infra/runners/run_qdrant_backup_service.py
            - name: SERVICE_ACCOUNT_NAME
              value: indexer-cron-sa
            - name: SPARSE_BATCH_FALLBACK
              value: '8'
            - name: SPARSE_URL
              value: http://sparse-svc.models.svc.cluster.local:8201
            - name: UAI_RAG_RW_CLIENT_ID
              value: ''
            - name: UPSERT_CHUNK
              value: '500'
            - name: USE_MANAGED_IDENTITY
              value: '0'
            resources:
              requests:
                cpu: '2'
                memory: 1Gi
              limits:
                cpu: '4'
                memory: 2Gi
      activeDeadlineSeconds: 3600
