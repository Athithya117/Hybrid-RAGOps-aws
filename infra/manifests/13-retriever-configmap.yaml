apiVersion: v1
kind: ConfigMap
metadata:
  name: retrieval-config
  namespace: inference
data:
  PORT: "8001"
  ENV: "local"
  QDRANT_URL: ""
  DENSE_URL: ""
  SPARSE_URL: ""
  RERANKER_URL: ""
  COLLECTION_NAME: ""
  HTTP_TIMEOUT: "10"
  DENSE_DIM: "768"
  MAX_CHUNKS_TO_LLM: "6"
  LLM_MODEL: "llama-3.1-8b-instant"
  LLM_MAX_TOKENS: "512"
  LLM_TEMPERATURE: "0.2"
  LLM_SYSTEM_PROMPT: |
    You are a clear concise assistant. Provide a short explanatory answer in 2-3 sentences. When you cite evidence, use only numeric tags like [1],[2]. Do NOT output filenames, URLs, raw page numbers.
  LLM_USER_PROMPT_TEMPLATE: |
    Summarize the following retrieved passages and answer the question in 2-3 sentences.\n\nQUESTION: {question
  RERANKER_MODE: "AUTO"
  RERANK_TOPK: "20"
  RERANKER_TOP_K: "20"
  RERANK_AUTO_THRESHOLD: "0.75"
  RERANK_THRESHOLD: "30"
  RERANK_MARGIN: "0.08"
  RERANK_ALPHA: "0.6"
  QUERY_TOPK_DENSE: "200"
  QUERY_TOPK_SPARSE: "200"
  RRF_TOP_N: "10"
