apiVersion: v1
kind: Service
metadata:
  name: retriever
  namespace: inference
  labels:

    app: 'retrieval'
    team: 'search'
    service: 'retrieval'
spec:
  selector:

      app: 'retrieval'
      team: 'search'
      service: 'retrieval'
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP