apiVersion: v1
kind: ServiceAccount
metadata:
  name: retrieval-sa
  namespace: inference

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retrieval-role
  namespace: inference
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retrieval-rb
  namespace: inference
subjects:
- kind: ServiceAccount
  name: retrieval-sa
  namespace: inference
roleRef:
  kind: Role
  name: retrieval-role
  apiGroup: rbac.authorization.k8s.io
