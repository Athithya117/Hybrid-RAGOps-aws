apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
  namespace: inference
  labels:
    app.kubernetes.io/name: retrieval
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retrieval
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retrieval
      annotations:
        monitoring.io/scrape: "true"
        monitoring.io/port: "8001"
    spec:
      containers:
        - name: retrieval
          image: docker.io/athithya5354/retrieval:v7
          ports:
            - name: metrics
              containerPort: 8001
