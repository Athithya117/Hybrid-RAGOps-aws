apiVersion: v1
kind: Namespace
metadata:
  name: models
  labels:
    app.kubernetes.io/name: dense
    app.kubernetes.io/component: embedder

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dense-config
  namespace: models
data:
  DENSE_PORT: '8200'
  ENV: STAGING

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dense-sa
  namespace: models

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dense-deployment
  namespace: models
  labels:
    app.kubernetes.io/name: dense
    app.kubernetes.io/component: embedder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dense
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dense
        app.kubernetes.io/component: embedder
    spec:
      serviceAccountName: dense-sa
      containers:
      - name: dense
        image: athithya5354/dense:amd64-arm64-v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8200
        env:
        - name: DENSE_PORT
          value: '8200'
        - name: ENV
          value: STAGING
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: dense
  namespace: models
  labels:
    app.kubernetes.io/name: dense
    app.kubernetes.io/component: embedder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dense
  ports:
  - name: http
    port: 8200
    targetPort: 8200

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dense-pdb
  namespace: models
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dense

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dense-hpa
  namespace: models
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dense-deployment
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 300

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dense-servicemonitor
  namespace: models
  labels:
    app.kubernetes.io/name: dense
    app.kubernetes.io/component: embedder
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dense
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - models

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dense-alerts
  namespace: models
  labels:
    app.kubernetes.io/name: dense
    app.kubernetes.io/component: embedder
spec:
  groups:
  - name: dense.rules
    rules:
    - alert: DenseModelLoadFailure
      expr: sum(rate(requests_total{endpoint="/health",status_code="500"}[5m])) >
        0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Dense embedder errors
    - alert: DenseHighP95Latency
      expr: histogram_quantile(0.95, sum(rate(request_duration_seconds_bucket[5m]))
        by (le)) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Dense embedder high p95 latency
