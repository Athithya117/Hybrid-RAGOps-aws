apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
  namespace: inference
  labels:

    app: 'retrieval'
    team: 'search'
spec:
  replicas: 1
  selector:
    matchLabels:

      app: 'retrieval'
      team: 'search'
  template:
    metadata:
      labels:

        app: 'retrieval'
        team: 'search'
      annotations:

        'monitoring.io/scrape': 'true'
        'monitoring.io/port': '8001'
        'monitoring.io/path': '/metrics'
    spec:
      containers:
        - name: retrieval
          image: docker.io/athithya5354/retrieval:v10
          envFrom:
            - configMapRef:
                name: retrieval-config
            - secretRef:
                name: retrieval-secrets
          env:
            - name: PORT
              value: "8001"
            - name: ENV
              value: "local"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retrieval-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retrieval-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retrieval-secrets
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: LLM_MODEL
                  optional: true
            - name: LLM_MAX_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: LLM_MAX_TOKENS
                  optional: true
            - name: LLM_TEMPERATURE
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: LLM_TEMPERATURE
                  optional: true
            - name: LLM_SYSTEM_PROMPT
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: LLM_SYSTEM_PROMPT
                  optional: true
            - name: LLM_USER_PROMPT_TEMPLATE
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: LLM_USER_PROMPT_TEMPLATE
                  optional: true
            - name: MAX_CHUNKS_TO_LLM
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: MAX_CHUNKS_TO_LLM
                  optional: true
            - name: RERANKER_MODE
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANKER_MODE
                  optional: true
            - name: RERANK_TOPK
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANK_TOPK
                  optional: true
            - name: RERANKER_TOP_K
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANKER_TOP_K
                  optional: true
            - name: RERANK_AUTO_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANK_AUTO_THRESHOLD
                  optional: true
            - name: RERANK_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANK_THRESHOLD
                  optional: true
            - name: RERANK_MARGIN
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANK_MARGIN
                  optional: true
            - name: RERANK_ALPHA
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RERANK_ALPHA
                  optional: true
            - name: QUERY_TOPK_DENSE
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: QUERY_TOPK_DENSE
                  optional: true
            - name: QUERY_TOPK_SPARSE
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: QUERY_TOPK_SPARSE
                  optional: true
            - name: RRF_TOP_N
              valueFrom:
                configMapKeyRef:
                  name: retrieval-config
                  key: RRF_TOP_N
                  optional: true
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
