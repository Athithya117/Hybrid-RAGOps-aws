apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmagent-pvc
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: managed-premium
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-pvc
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-premium
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent-clusterrole
rules:
- apiGroups: [""]
  resources: ["pods","endpoints","services","nodes","namespaces"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent-clusterrole
subjects:
- kind: ServiceAccount
  name: vmagent
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
        - role: endpoints
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: kube-state-metrics
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: monitoring
        - source_labels: [__meta_kubernetes_endpoint_address, __meta_kubernetes_endpoint_port]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__
        - action: drop
          source_labels: [__address__]
          regex: ^$
        - target_label: __metrics_path__
          replacement: /metrics
        - target_label: job
          replacement: kube-state-metrics

      - job_name: clickhouse-exporter
        kubernetes_sd_configs:
        - role: endpoints
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: clickhouse-exporter
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: observability
        - source_labels: [__meta_kubernetes_endpoint_address, __meta_kubernetes_endpoint_port]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__
        - action: drop
          source_labels: [__address__]
          regex: ^$
        - target_label: __metrics_path__
          replacement: /metrics
        - target_label: job
          replacement: clickhouse-exporter

      - job_name: vector-prometheus-exporter
        kubernetes_sd_configs:
        - role: endpoints
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: vector-agent
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: observability
        - source_labels: [__meta_kubernetes_endpoint_address, __meta_kubernetes_endpoint_port]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__
        - action: drop
          source_labels: [__address__]
          regex: ^$
        - target_label: __metrics_path__
          replacement: /metrics
        - target_label: job
          replacement: vector-prometheus-exporter
      - job_name: k8s-pods-qdrant
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: qdrant
        - source_labels: [__meta_kubernetes_pod_annotation_monitoring_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_ready]
          action: keep
          regex: "true"

        - source_labels: [__meta_kubernetes_pod_ip,__meta_kubernetes_pod_annotation_monitoring_io_port]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__

        - source_labels: [__meta_kubernetes_pod_ip,__meta_kubernetes_pod_container_port_number]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__

        - action: drop
          source_labels: [__address__]
          regex: ^$

        - source_labels: [__meta_kubernetes_pod_annotation_monitoring_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
          replacement: $1
        - source_labels: [__metrics_path__]
          action: replace
          regex: ^$
          replacement: /metrics
          target_label: __metrics_path__

        - target_label: job
          replacement: qdrant

        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: replace
          target_label: service
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: replace
          target_label: service
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_label_team]
          action: replace
          target_label: service
          regex: (.+)

      - job_name: k8s-pods-retriever
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: inference
        - source_labels: [__meta_kubernetes_pod_annotation_monitoring_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_ready]
          action: keep
          regex: "true"

        - source_labels: [__meta_kubernetes_pod_ip,__meta_kubernetes_pod_annotation_monitoring_io_port]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_ip,__meta_kubernetes_pod_container_port_number]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__
        - action: drop
          source_labels: [__address__]
          regex: ^$

        - source_labels: [__meta_kubernetes_pod_annotation_monitoring_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
          replacement: $1
        - source_labels: [__metrics_path__]
          action: replace
          regex: ^$
          replacement: /metrics
          target_label: __metrics_path__

        - target_label: job
          replacement: retriever

        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: replace
          target_label: service
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: replace
          target_label: service
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_label_team]
          action: replace
          target_label: service
          regex: (.+)

      - job_name: k8s-pods-vmagent-self
        kubernetes_sd_configs:
        - role: endpoints
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: vmagent
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: monitoring

        - source_labels: [__meta_kubernetes_endpoint_address, __meta_kubernetes_endpoint_port]
          action: replace
          regex: (.+);(.+)
          replacement: '$1:$2'
          target_label: __address__

        - action: drop
          source_labels: [__address__]
          regex: ^$

        - target_label: __metrics_path__
          replacement: /metrics

        - target_label: job
          replacement: vmagent-self

        - source_labels: [__meta_kubernetes_pod_label_app]
          action: replace
          target_label: service
          regex: (.+)
          replacement: vmagent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
- apiGroups: [""]
  resources: ["nodes","pods","services","endpoints","namespaces"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","daemonsets","replicasets","statefulsets"]
  verbs: ["get","list","watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get","list","watch"]
- apiGroups: ["extensions"]
  resources: ["daemonsets","replicasets"]
  verbs: ["get","list","watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  ports:
  - port: 8080
    name: http-metrics
    targetPort: 8080
  selector:
    app: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
      - name: kube-state-metrics
        image: k8s.gcr.io/kube-state-metrics/kube-state-metrics:v2.8.0
        ports:
        - containerPort: 8080
        args:
        - '--metric-labels-allowlist=pods=[*]'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
      annotations:
        monitoring/vmagent-config-checksum: "a14d47164a8a0f0dfb2ce65905b01c3875387c57d24fc5dc71895504b6d150bf"
    spec:
      serviceAccountName: vmagent
      initContainers:
      - name: wait-victoria-write
        image: curlimages/curl:8.3.0
        command:
        - sh
        - -c
        - |
          max=120
          wait=1
          url="http://victoria-metrics.monitoring.svc.cluster.local:8428/api/v1/write"
          for i in $(seq 1 $max); do
            if curl -sS --max-time 5 -X POST -H 'Content-Type: application/json' --data '{}' "$url" >/dev/null 2>&1; then
              echo "victoria write endpoint reachable"
              exit 0
            fi
            sleep $wait
            wait=$(( wait < 8 ? wait+1 : 8 ))
          done
          echo "timed out waiting for victoria write endpoint" >&2
          exit 1
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.99.0
        args:
        - "-promscrape.config=/config/scrape.yml"
        - "-remoteWrite.url=http://victoria-metrics.monitoring.svc.cluster.local:8428/api/v1/write"
        - "-remoteWrite.tmpDataPath=/vmagent-remotewrite-data"
        - "-promscrape.suppressDuplicateScrapeTargetErrors=true"
        - "-promscrape.suppressScrapeErrors=true"
        - "-promscrape.suppressScrapeErrorsDelay=30s"
        ports:
        - containerPort: 8429
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8429
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tmp
          mountPath: /vmagent-remotewrite-data
      volumes:
      - name: config
        configMap:
          name: vmagent-config
      - name: tmp
        persistentVolumeClaim:
          claimName: vmagent-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: monitoring
spec:
  selector:
    app: vmagent
  ports:
  - name: metrics
    port: 8429
    targetPort: 8429
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
      - name: victoria-metrics
        image: victoriametrics/victoria-metrics:v1.99.0
        args:
        - "-retentionPeriod=1d"
        - "-storageDataPath=/data"
        - "-httpListenAddr=:8428"
        ports:
        - containerPort: 8428
        readinessProbe:
          httpGet:
            path: /health
            port: 8428
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoria-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  selector:
    app: victoria-metrics
  ports:
  - port: 8428
    targetPort: 8428
