apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: monitoring
data:
  slo.rules.yaml: "groups:\n- name: recording-rules\n  rules:\n  - record: retrieval_errors_rate_1h\n\
    \    expr: sum(rate(retrieval_errors_total[1h]))\n  - record: retrieval_requests_rate_1h\n\
    \    expr: sum(rate(retrieval_requests_total[1h]))\n  - record: retrieval_errors_rate_6h\n\
    \    expr: sum(rate(retrieval_errors_total[6h]))\n  - record: retrieval_requests_rate_6h\n\
    \    expr: sum(rate(retrieval_requests_total[6h]))\n  - record: qdrant_rest_fail_rate_1h\n\
    \    expr: sum(rate(rest_responses_fail_total[1h]))\n  - record: qdrant_rest_total_rate_1h\n\
    \    expr: sum(rate(rest_responses_total[1h]))\n- name: ingestion-truth\n  rules:\n\
    \  - alert: VmagentDiscoveryEmpty\n    expr: vm_promscrape_discovery_kubernetes_objects{role=\"\
    pod\"} == 0\n    for: 2m\n    labels:\n      severity: critical\n      plane:\
    \ ingestion\n      service: vmagent\n    annotations:\n      summary: vmagent\
    \ pod discovery returned zero objects\n      description: Verify vmagent is running\
    \ and able to list Kubernetes endpoints.\n        Check vmagent logs for discovery\
    \ errors and RBAC permissions.\n      runbook: https://defaultsa515.z13.web.core.windows.net/vmagent-discovery-empty.html\n\
    \  - alert: VmagentNoRemoteWrite\n    expr: increase(vm_persistentqueue_bytes_written_total[5m])\
    \ == 0\n    for: 5m\n    labels:\n      severity: critical\n      plane: ingestion\n\
    \      service: vmagent\n    annotations:\n      summary: vmagent reports no remote-write\
    \ bytes to Victoria in the last 5m\n      description: Confirm vmagent can establish\
    \ remote-write connections and that\n        VictoriaMetrics is reachable at DATASOURCE_URL.\
    \ Check persistent queue metrics\n        and network connectivity.\n      runbook:\
    \ https://defaultsa515.z13.web.core.windows.net/vmagent-no-remote-write.html\n\
    - name: service-safety\n  rules:\n  - alert: RetrieverNotReady\n    expr: service_ready{service=\"\
    retrieval\"} == 0\n    for: 2m\n    labels:\n      severity: critical\n      plane:\
    \ safety\n      service: retriever\n    annotations:\n      summary: Retriever\
    \ service reports not ready\n      description: Check retriever deployment, readiness\
    \ probes, recent events, and\n        downstream dependencies.\n      runbook:\
    \ https://defaultsa515.z13.web.core.windows.net/retriever-not-ready.html\n  -\
    \ alert: QdrantDeadReplicas\n    expr: collection_dead_replicas > 0\n    for:\
    \ 2m\n    labels:\n      severity: critical\n      plane: safety\n      service:\
    \ qdrant\n    annotations:\n      summary: Qdrant reports dead replicas for at\
    \ least one collection\n      description: Inspect qdrant cluster health, pod\
    \ logs, and storage errors. Follow\n        cluster recovery steps in runbook.\n\
    \      runbook: https://defaultsa515.z13.web.core.windows.net/qdrant-dead-replicas.html\n\
    \  - alert: QdrantSnapshotStuck\n    expr: snapshot_creation_running > 0\n   \
    \ for: 30m\n    labels:\n      severity: warning\n      plane: safety\n      service:\
    \ qdrant\n    annotations:\n      summary: Qdrant snapshot running for > 30m\n\
    \      description: Investigate snapshot process and storage backend latency.\
    \ Consider\n        cancelling or throttling snapshot according to runbook.\n\
    \      runbook: https://defaultsa515.z13.web.core.windows.net/qdrant-snapshot-stuck.html\n\
    - name: retriever-slo\n  rules:\n  - alert: RetrieverErrorBudgetFastBurn\n   \
    \ expr: ((retrieval_errors_rate_1h / clamp_min(retrieval_requests_rate_1h, 1))\
    \ /\n      (1 - 0.999) > 2) and (retrieval_requests_rate_1h > 50)\n    for: 10m\n\
    \    labels:\n      severity: critical\n      plane: slo\n      service: retriever\n\
    \    annotations:\n      summary: Retriever error budget fast burn (1h)\n    \
    \  description: Fast burn detected; investigate retriever errors, recent deploys,\n\
    \        and backend failures.\n      runbook: https://defaultsa515.z13.web.core.windows.net/retriever-error-budget-fast-burn.html\n\
    \  - alert: RetrieverErrorBudgetSlowBurn\n    expr: ((retrieval_errors_rate_6h\
    \ / clamp_min(retrieval_requests_rate_6h, 1)) /\n      (1 - 0.999) > 1.2) and\
    \ (retrieval_requests_rate_6h > 50)\n    for: 30m\n    labels:\n      severity:\
    \ warning\n      plane: slo\n      service: retriever\n    annotations:\n    \
    \  summary: Retriever error budget slow burn (6h)\n      description: Slow burn\
    \ in error budget; review trends and mitigations in runbook.\n      runbook: https://defaultsa515.z13.web.core.windows.net/retriever-error-budget-slow-burn.html\n\
    \  - alert: RetrieverHighP95Latency\n    expr: histogram_quantile(0.95, sum(rate(retrieval_request_duration_seconds_bucket[5m]))\n\
    \      by (le)) > 0.5\n    for: 5m\n    labels:\n      severity: warning\n   \
    \   plane: slo\n      service: retriever\n    annotations:\n      summary: Retriever\
    \ p95 latency above threshold\n      description: High p95 latency observed; check\
    \ retriever CPU/memory, GC, and\n        downstream latency.\n      runbook: https://defaultsa515.z13.web.core.windows.net/retriever-high-p95-latency.html\n\
    - name: qdrant-slo\n  rules:\n  - alert: QdrantErrorBudgetFastBurn\n    expr:\
    \ ((qdrant_rest_fail_rate_1h / clamp_min(qdrant_rest_total_rate_1h, 1)) /\n  \
    \    (1 - 0.999) > 2) and (qdrant_rest_total_rate_1h > 50)\n    for: 10m\n   \
    \ labels:\n      severity: critical\n      plane: slo\n      service: qdrant\n\
    \    annotations:\n      summary: Qdrant error budget fast burn (1h)\n      description:\
    \ High error-rate for Qdrant; inspect cluster health and storage\n        errors.\n\
    \      runbook: https://defaultsa515.z13.web.core.windows.net/qdrant-error-budget-fast-burn.html\n\
    \  - alert: QdrantHighP95Latency\n    expr: histogram_quantile(0.95, sum(rate(rest_responses_duration_seconds_bucket[5m]))\n\
    \      by (le)) > 0.8\n    for: 5m\n    labels:\n      severity: warning\n   \
    \   plane: slo\n      service: qdrant\n    annotations:\n      summary: Qdrant\
    \ p95 latency above threshold\n      description: Qdrant latency high; check indexing\
    \ operations, storage I/O, and\n        cluster load.\n      runbook: https://defaultsa515.z13.web.core.windows.net/qdrant-high-p95-latency.html\n"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
  labels:
    app: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
      - name: vmalert
        image: victoriametrics/vmalert:v1.132.0
        args:
        - -rule=/etc/vmalert/slo.rules.yaml
        - -datasource.url=http://victoria-metrics.monitoring.svc:8428
        - -notifier.url=http://alertmanager.monitoring.svc:9093
        - -evaluationInterval=30s
        - -remoteWrite.url=http://victoria-metrics.monitoring.svc.cluster.local:8428/api/v1/write
        volumeMounts:
        - name: rules
          mountPath: /etc/vmalert
        ports:
        - containerPort: 8880
          name: http
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8880
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: rules
        configMap:
          name: vmalert-rules

---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: monitoring
spec:
  selector:
    app: vmalert
  ports:
  - name: http
    port: 8080
    targetPort: 8880

